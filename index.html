<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffb84d">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 가족">
<title>우리 가족 채팅방</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root {
    --bg: #fff7ec; --panel: #ffffff; --ink: #2b2420; --muted: #8a7d73; --line: #f0e2d1;
    --me: #ffd27a; --me-ink: #3a2a10; --other: #ffffff;
    --accent: #ff9a2e; --accent-dark: #e5821a; --soft: #fff0da; --danger: #d9363e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-size: 17px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; }
  .hidden { display: none !important; }

  /* 들어가기 화면 */
  #login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 390px; background: var(--panel); border-radius: 26px; padding: 32px 24px 26px;
          box-shadow: 0 12px 34px rgba(130, 85, 30, .13); text-align: center; }
  .house { font-size: 60px; line-height: 1; }
  .card h1 { font-size: 26px; margin: 12px 0 6px; }
  .card p { color: var(--muted); margin: 0 0 24px; font-size: 15px; line-height: 1.5; }
  .field { display: block; text-align: left; margin-bottom: 14px; }
  .field span { display: block; font-size: 14px; color: var(--muted); margin: 0 0 6px 4px; }
  .field input { width: 100%; font-size: 18px; padding: 14px 16px; border: 2px solid var(--line); border-radius: 14px;
                 outline: none; background: #fffdfa; color: var(--ink); }
  .field input:focus { border-color: var(--accent); }
  .btn { width: 100%; font-size: 18px; font-weight: 700; padding: 15px; border: 0; border-radius: 14px;
         background: var(--accent); color: #fff; cursor: pointer; margin-top: 4px; }
  .btn:active { background: var(--accent-dark); }
  .btn:disabled { opacity: .6; }
  .err { color: var(--danger); font-size: 15px; min-height: 22px; margin: 12px 0 0; }

  /* 채팅 화면 */
  #chat { height: 100%; height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); }
  header h2 { font-size: 19px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me-chip { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .link-btn { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 8px 4px; cursor: pointer; text-decoration: underline; }

  #list { flex: 1; overflow-y: auto; padding: 8px 12px 12px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .day { text-align: center; margin: 18px 0 10px; }
  .day span { background: rgba(80, 50, 20, .07); color: var(--muted); font-size: 13px; padding: 5px 12px; border-radius: 999px; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row.cont { margin-top: 3px; }
  .row.mine { flex-direction: row-reverse; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: 17px; }
  .row.mine .avatar { display: none; }
  .row.cont .avatar { visibility: hidden; height: 0; }
  .col { display: flex; flex-direction: column; min-width: 0; max-width: min(78%, 540px); }
  .row.mine .col { align-items: flex-end; }
  .name { font-size: 13px; color: var(--muted); margin: 2px 0 4px 4px; }
  .row.cont .name, .row.mine .name { display: none; }
  .line { display: flex; align-items: flex-end; gap: 6px; max-width: 100%; }
  .row.mine .line { flex-direction: row-reverse; }
  .bubble { background: var(--other); padding: 10px 14px; border-radius: 18px; border-top-left-radius: 6px; min-width: 0;
            white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; line-height: 1.45;
            box-shadow: 0 1px 2px rgba(80, 50, 20, .08); }
  .row.cont .bubble { border-top-left-radius: 18px; }
  .row.mine .bubble { background: var(--me); color: var(--me-ink); border-radius: 18px; border-top-right-radius: 6px; }
  .row.mine.cont .bubble { border-top-right-radius: 18px; }
  .bubble.media { padding: 4px; background: var(--other); }
  .bubble.media img, .bubble.media video { display: block; max-width: 100%; max-height: 380px; border-radius: 14px; background: #f3ebe1; }
  .bubble.media img { cursor: zoom-in; min-height: 60px; }
  .bubble.media video { width: 340px; }
  .meta { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; flex: none; }
  .row.mine .meta { align-items: flex-end; }
  .time { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .dots { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 2px 4px; cursor: pointer; }
  .pending .bubble { opacity: .7; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; width: 180px; max-width: 100%; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .retry { margin-top: 6px; font-size: 13px; color: var(--danger); background: #fff; border: 1px solid #f2c1c3; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .more { display: block; margin: 8px auto 4px; border: 1px solid var(--line); background: #fff; color: var(--muted);
          border-radius: 999px; padding: 9px 18px; font-size: 14px; cursor: pointer; }
  .empty { text-align: center; color: var(--muted); margin-top: 28vh; line-height: 1.6; white-space: pre-line; }

  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  .icon-btn { flex: none; width: 50px; height: 50px; border-radius: 50%; border: 0; background: var(--soft); font-size: 25px; cursor: pointer; }
  .icon-btn:active { background: #ffe2b8; }
  textarea { flex: 1; min-width: 0; resize: none; font: inherit; font-size: 17px; line-height: 1.35; padding: 13px 16px; height: 50px; max-height: 150px;
             border: 2px solid var(--line); border-radius: 25px; outline: none; background: #fffdfa; color: var(--ink); }
  textarea:focus { border-color: var(--accent); }
  .send { flex: none; height: 50px; padding: 0 20px; border-radius: 25px; border: 0; background: var(--accent); color: #fff; font-weight: 700; font-size: 17px; cursor: pointer; }
  .send:active { background: var(--accent-dark); }

  #viewer { position: fixed; inset: 0; background: rgba(15, 10, 5, .94); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #viewer .close { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; width: 48px; height: 48px;
                   color: #fff; font-size: 30px; background: rgba(255,255,255,.12); border: 0; border-radius: 50%; cursor: pointer; }
  #viewer a { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom)); color: #fff; font-size: 15px;
              background: rgba(255,255,255,.16); padding: 11px 20px; border-radius: 999px; text-decoration: none; }
  .toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 20;
           background: #2b2420; color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 15px; max-width: calc(100% - 32px); text-align: center; }
  .drop { outline: 3px dashed var(--accent); outline-offset: -8px; }

  .bell { border: 0; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
          background: var(--accent); color: #fff; }
  .bell.on { background: var(--soft); color: var(--accent-dark); font-weight: 600; }
  #help { position: fixed; inset: 0; background: rgba(40, 25, 10, .45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 15; }
  #help .card { text-align: left; max-width: 420px; }
  #help h3 { margin: 0 0 12px; font-size: 20px; }
  #help ol { margin: 0 0 18px; padding-left: 22px; line-height: 1.7; }
  #help .note { color: var(--muted); font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
  @media (max-width: 480px) { .me-chip { display: none; } }

  /* 프로필 사진·읽음 표시 */
  .avatar { background-size: cover; background-position: center; }
  .avatar.sm { width: 32px; height: 32px; font-size: 14px; }
  .avatar.xs { width: 16px; height: 16px; font-size: 9px; }
  .me-btn { display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px; cursor: pointer; color: inherit; }
  #profile { position: fixed; inset: 0; background: rgba(40, 25, 10, .45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 15; }
  #profile .card { max-width: 380px; }
  #profile h3 { margin: 0 0 16px; font-size: 20px; }
  .pf-av { width: 120px; height: 120px; font-size: 48px; margin: 0 auto 12px; }
  .pf-actions { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .btn.ghost { background: #eee3d6; color: var(--ink); margin-top: 8px; }
  .seen { display: flex; align-items: center; gap: 3px; margin: 3px 0 0 48px; font-size: 11px; color: var(--muted); }
  .seen.mine { justify-content: flex-end; margin-left: 0; }
  .seen-text { margin-left: 3px; }

  /* 통화 */
  .head-btn { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--soft); font-size: 20px; cursor: pointer; }
  .head-btn:active { background: #ffe2b8; }
  #pick { position: fixed; inset: 0; background: rgba(40, 25, 10, .45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 15; }
  #pick .card { text-align: left; max-width: 440px; max-height: 80vh; overflow-y: auto; }
  #pick h3 { margin: 0 0 6px; font-size: 20px; }
  #pick .note { color: var(--muted); font-size: 14px; margin: 0 0 12px; line-height: 1.5; white-space: pre-line; }
  .member { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .member .avatar { width: 44px; height: 44px; }
  .member .nm { flex: 1; font-weight: 700; font-size: 18px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .mbtn { border: 0; border-radius: 999px; padding: 10px 14px; background: var(--soft); color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .mbtn:active { background: #ffe2b8; }
  #pick .btn { margin-top: 16px; background: #eee3d6; color: var(--ink); }

  #callView { position: fixed; inset: 0; z-index: 30; background: #241a13; color: #fff; overflow: hidden; }
  #remoteVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; display: none; }
  #callView.with-video #remoteVideo { display: block; }
  #localVideo { position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 16px; width: 28vw; max-width: 190px; min-width: 110px;
                aspect-ratio: 3 / 4; object-fit: cover; border-radius: 16px; background: #000; transform: scaleX(-1);
                box-shadow: 0 6px 20px rgba(0,0,0,.4); display: none; z-index: 2; }
  #callView.show-local #localVideo { display: block; }
  .call-info { position: absolute; left: 0; right: 0; top: 18%; text-align: center; padding: 0 16px; }
  #callView.with-video .call-info { top: calc(18px + env(safe-area-inset-top)); left: 16px; right: auto; text-align: left; padding: 0;
                                     text-shadow: 0 1px 4px rgba(0,0,0,.7); z-index: 2; }
  .call-avatar { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;
                 font-size: 50px; font-weight: 700; box-shadow: 0 0 0 10px rgba(255,255,255,.08); }
  #callView.ringing .call-avatar { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 22px rgba(255,255,255,.04); } }
  #callView.with-video .call-avatar { display: none; }
  .call-name { font-size: 30px; font-weight: 700; }
  #callView.with-video .call-name { font-size: 20px; }
  .call-status { margin-top: 8px; font-size: 17px; opacity: .85; }
  .call-actions { position: absolute; left: 0; right: 0; bottom: calc(40px + env(safe-area-inset-bottom)); display: flex; justify-content: center;
                  gap: 28px; z-index: 2; }
  .c-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; color: #fff; font-size: 14px; cursor: pointer; }
  .c-btn span { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px;
                background: rgba(255,255,255,.18); }
  .c-btn.red span { background: #e5484d; }
  .c-btn.green span { background: #30a46c; }
  .c-btn.off span { background: #fff; color: #241a13; }
  #callView.with-video .c-btn { text-shadow: 0 1px 4px rgba(0,0,0,.7); }
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="card" id="loginForm" autocomplete="on">
    <div class="house">🏠</div>
    <h1>우리 가족 채팅방</h1>
    <p>이름과 가족 비밀번호를 넣으면 들어갈 수 있어요.<br>한 번 들어오면 이 기기에서는 계속 기억해요.</p>
    <label class="field"><span>내 이름</span>
      <input id="nameInput" type="text" maxlength="20" placeholder="예: 엄마, 아빠, 민결" autocomplete="nickname" required>
    </label>
    <label class="field"><span>가족 비밀번호</span>
      <input id="pwInput" type="password" placeholder="가족끼리 정한 비밀번호" autocomplete="current-password" required>
    </label>
    <button class="btn" id="loginBtn" type="submit">들어가기</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<section id="chat" class="hidden">
  <header>
    <h2>🏠 우리 가족</h2>
    <button class="me-btn" id="meBtn" type="button" aria-label="내 프로필">
      <span class="avatar sm" id="meAvatar"></span><span class="me-chip" id="meChip"></span>
    </button>
    <button class="head-btn hidden" id="installBtn" type="button" aria-label="앱으로 설치" title="앱으로 설치">📲</button>
    <button class="head-btn" id="callBtn" type="button" aria-label="전화 걸기">📞</button>
    <button class="bell" id="bellBtn" type="button">🔔 알림 켜기</button>
    <button class="link-btn" id="logoutBtn" type="button">나가기</button>
  </header>
  <main id="list">
    <div class="wrap" id="msgs"></div>
    <div class="wrap" id="pending"></div>
  </main>
  <footer>
    <div class="composer">
      <button class="icon-btn" id="attachBtn" type="button" aria-label="사진이나 동영상 보내기">📷</button>
      <input id="fileInput" type="file" accept="image/*,video/*" multiple hidden>
      <textarea id="text" rows="1" placeholder="메시지를 적어 보세요" enterkeyhint="send"></textarea>
      <button class="send" id="sendBtn" type="button">보내기</button>
    </div>
  </footer>
</section>

<div id="viewer" class="hidden">
  <img id="viewerImg" alt="">
  <button class="close" id="viewerClose" type="button" aria-label="닫기">✕</button>
  <a id="viewerSave" href="#" rel="noopener">⬇ 원본 저장</a>
</div>

<div id="help" class="hidden" role="dialog" aria-modal="true">
  <div class="card">
    <h3 id="helpTitle"></h3>
    <div id="helpBody"></div>
    <button class="btn" id="helpOk" type="button">알겠어요</button>
  </div>
</div>

<div id="profile" class="hidden" role="dialog" aria-modal="true">
  <div class="card">
    <h3>내 프로필</h3>
    <div class="avatar pf-av" id="pfAvatar"></div>
    <div class="pf-actions">
      <button class="mbtn" id="pfPhoto" type="button">📷 사진 바꾸기</button>
      <button class="mbtn" id="pfRemove" type="button">사진 지우기</button>
    </div>
    <input id="pfFile" type="file" accept="image/*" hidden>
    <label class="field"><span>내 이름</span>
      <input id="pfName" type="text" maxlength="20">
    </label>
    <button class="btn" id="pfSave" type="button">이름 바꾸기</button>
    <button class="btn ghost" id="pfClose" type="button">닫기</button>
    <div class="err" id="pfErr" role="alert"></div>
  </div>
</div>

<div id="pick" class="hidden" role="dialog" aria-modal="true">
  <div class="card">
    <h3>누구에게 전화할까요?</h3>
    <p class="note">와이파이나 데이터가 켜져 있으면 무료로 통화할 수 있어요.</p>
    <div id="pickList"></div>
    <button class="btn" id="pickClose" type="button">닫기</button>
  </div>
</div>

<div id="callView" class="hidden">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div class="call-info">
    <div class="call-avatar" id="callAvatar"></div>
    <div class="call-name" id="callName"></div>
    <div class="call-status" id="callStatus"></div>
  </div>
  <div class="call-actions" id="callActions"></div>
</div>

<script>
(() => {
  const MAX_BYTES = 50 * 1024 * 1024;
  const TITLE = document.title;
  const TOUCH = matchMedia('(pointer: coarse)').matches;

  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  let token = store.get('fc_token');
  let myName = store.get('fc_name') || '';
  let msgs = [];            // id 순서로 정렬된 메시지
  const ids = new Set();
  const rows = new Map();   // id -> 화면 줄 (사진·영상을 다시 불러오지 않으려고 보관)
  let cursor = 0;           // 이 번호 이후의 새 메시지를 가져온다
  let renderedMax = 0;
  let hasMore = false;
  let timer = null, polling = false, pollAgain = false;
  let unread = 0, stick = true;

  const list = $('#list'), box = $('#msgs'), pendingBox = $('#pending'), ta = $('#text');

  // ---------- 서버 ----------
  async function api(path, opts = {}) {
    const headers = { 'content-type': 'application/json' };
    if (token) headers.authorization = 'Bearer ' + token;
    let res;
    try { res = await fetch(path, { ...opts, headers }); }
    catch { throw new Error('인터넷 연결을 확인해 주세요'); }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== '/api/login') { logout('다시 들어와 주세요'); throw new Error('다시 들어와 주세요'); }
    if (!res.ok) throw new Error(data.error || '문제가 생겼어요');
    return data;
  }

  // ---------- 날짜·이름 꾸미기 ----------
  const dayFmt = new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  const timeFmt = new Intl.DateTimeFormat('ko-KR', { hour: 'numeric', minute: '2-digit' });
  const dayKey = (m) => new Date(m.created_at).toDateString();
  const isCont = (prev, m) => prev && prev.author === m.author && dayKey(prev) === dayKey(m)
    && (new Date(m.created_at) - new Date(prev.created_at)) < 5 * 60 * 1000;
  function colorOf(name) {
    let h = 0;
    for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
    return `hsl(${h} 58% 56%)`;
  }

  // ---------- 화면 그리기 ----------
  function buildRow(m) {
    const mine = m.author === myName;
    const row = el('div', 'row' + (mine ? ' mine' : ''));
    const av = el('div', 'avatar');
    paintAvatar(av, m.author);
    const col = el('div', 'col');
    const line = el('div', 'line');
    const b = el('div', 'bubble');

    if ((m.kind === 'image' || m.kind === 'video') && m.url) {
      b.classList.add('media');
      if (m.kind === 'image') {
        const img = el('img');
        img.alt = m.author + '님이 보낸 사진';
        img.loading = 'lazy';
        img.src = m.url;
        img.onload = keepBottom;
        img.onclick = () => openViewer(m.url);
        b.append(img);
      } else {
        const v = el('video');
        v.controls = true;
        v.playsInline = true;
        v.preload = 'metadata';
        v.src = m.url + '#t=0.1';
        v.onloadedmetadata = keepBottom;
        b.append(v);
      }
    } else if (m.kind !== 'text') {
      b.textContent = '(파일을 불러올 수 없어요)';
    } else {
      b.textContent = m.body;
    }

    const meta = el('div', 'meta');
    if (mine) {
      const dots = el('button', 'dots', '⋯');
      dots.type = 'button';
      dots.title = '지우기';
      dots.setAttribute('aria-label', '이 메시지 지우기');
      dots.onclick = () => removeMessage(m);
      meta.append(dots);
    }
    meta.append(el('div', 'time', timeFmt.format(new Date(m.created_at))));

    line.append(b, meta);
    col.append(el('div', 'name', m.author), line);
    row.append(av, col);
    return row;
  }

  function place(parent, prev, m) {
    if (!prev || dayKey(prev) !== dayKey(m)) {
      const d = el('div', 'day');
      d.append(el('span', null, dayFmt.format(new Date(m.created_at))));
      parent.append(d);
    }
    let row = rows.get(m.id);
    if (!row) { row = buildRow(m); rows.set(m.id, row); }
    row.classList.toggle('cont', !!isCont(prev, m));
    parent.append(row);
  }

  function renderAll() {
    const frag = document.createDocumentFragment();
    if (hasMore) {
      const more = el('button', 'more', '이전 대화 더 보기');
      more.type = 'button';
      more.onclick = () => loadOlder(more);
      frag.append(more);
    }
    if (!msgs.length) frag.append(el('div', 'empty', '아직 대화가 없어요.\n첫 인사를 남겨 보세요 👋'));
    let prev = null;
    for (const m of msgs) { place(frag, prev, m); prev = m; }
    box.replaceChildren(frag);
    renderedMax = msgs.length ? msgs[msgs.length - 1].id : 0;
    renderSeen();
  }

  function addMessages(list) {
    const added = [];
    for (const m of list) {
      if (ids.has(m.id)) continue;
      ids.add(m.id); msgs.push(m); added.push(m);
    }
    if (!added.length) return added;
    msgs.sort((a, b) => a.id - b.id);
    if (renderedMax === 0 || added.some((m) => m.id < renderedMax)) {
      renderAll();
    } else {
      // 끝에 붙이기만 해서 보고 있던 동영상이 멈추지 않게 한다
      box.querySelector('.empty')?.remove();
      for (const m of added) place(box, msgs[msgs.indexOf(m) - 1] || null, m);
      renderedMax = msgs[msgs.length - 1].id;
      renderSeen();
    }
    if (stick || added.some((m) => m.author === myName)) scrollBottom();
    return added;
  }

  // ---------- 글 보내기 ----------
  async function sendText(text) {
    const p = addPending(text, false);

      const d = await api('/api/messages', { method: 'POST', body: JSON.stringify({ kind: 'text', body: text }) });

  // ---------- 사진·동영상 보내기 ----------
  const EXT_TYPE = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp',
    heic: 'image/heic', heif: 'image/heif', mp4: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm',
    '3gp': 'video/3gpp', m4v: 'video/x-m4v' };
  const typeOf = (f) => f.type || EXT_TYPE[(f.name.split('.').pop() || '').toLowerCase()] || '';

  // 큰 사진은 2048px 이하 JPEG로 줄여서 빨리 보내고 저장공간을 아낀다
  async function shrinkImage(file, type) {
    if (type === 'image/gif') return file;
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, 2048 / Math.max(w, h));
      const browserFriendly = /jpeg|png|webp/.test(type);
      if (s === 1 && browserFriendly && file.size < 1.5 * 1024 * 1024) return file;
      const c = document.createElement('canvas');
      c.width = Math.round(w * s); c.height = Math.round(h * s);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
      return blob || file;
    } catch {
      return file;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function putFile(url, blob, onProgress) {
    return new Promise((resolve, reject) => {
      const fd = new FormData();
      fd.append('cacheControl', '31536000');
      fd.append('', blob, 'file');
      const x = new XMLHttpRequest();
      x.open('PUT', url);
      x.setRequestHeader('x-upsert', 'false');
      x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      x.onload = () => (x.status < 300 ? resolve() : reject(new Error('올리기에 실패했어요')));
      x.onerror = () => reject(new Error('인터넷 연결을 확인해 주세요'));
      x.send(fd);
    });
  }

  async function sendFile(file) {
    let type = typeOf(file);
    const isImage = type.startsWith('image/'), isVideo = type.startsWith('video/');
    if (!isImage && !isVideo) { toast('사진이나 동영상만 보낼 수 있어요'); return; }

    const p = addPending(isVideo ? '🎬 동영상 보내는 중…' : '🖼️ 사진 보내는 중…', true);
    try {
      let blob = file;
      if (isImage) { blob = await shrinkImage(file, type); if (blob !== file) type = 'image/jpeg'; }
      if (blob.size > MAX_BYTES) throw new Error('파일이 너무 커요 (50MB까지)');
      const up = await api('/api/upload', { method: 'POST', body: JSON.stringify({ type, size: blob.size }) });
      await putFile(up.signedUrl, new Blob([blob], { type }), p.progress);
      const d = await api('/api/messages', { method: 'POST', body: JSON.stringify({
        kind: isVideo ? 'video' : 'image', media_path: up.path, media_type: type }) });
      p.done();
      addMessages([d.message]);
      poll();
    } catch (e) {
      p.fail(e.message, () => sendFile(file));
    }
  }

  async function sendFiles(files) {
    for (const f of files) await sendFile(f);
  }

  // ---------- 새 메시지 가져오기 (3초마다) ----------
  async function poll() {
    if (!token) return;
    if (polling) { pollAgain = true; return; }
    polling = true;
    clearTimeout(timer);
    try {
      // 화면을 보고 있으면 "여기까지 봤어요"를 같이 알린다
      const top = msgs.length ? msgs[msgs.length - 1].id : 0;
      const readNow = !document.hidden && top > sentRead ? top : 0;
      const d = await api('/api/messages?after=' + cursor + '&sig=' + sigCursor + (readNow ? '&read=' + readNow : ''));
      if (readNow) sentRead = readNow;
      handleSignals(d.signals, d.now);
      handleReads(d.reads);
      if (d.messages.length) {
        cursor = Math.max(cursor, ...d.messages.map((m) => m.id));
        const added = addMessages(d.messages);
        const others = added.filter((m) => m.author !== myName).length;
        if (document.hidden && others) {
          unread += others;
          document.title = `(${unread}) ${TITLE}`;
        }
        // 알림을 안 켠 기기에서 채팅방을 보고 있으면 "띵" 소리와 진동으로 알려 준다
        if (others && !pushOn && !document.hidden) chime();
      }
    } catch {}
    polling = false;
    if (pollAgain) { pollAgain = false; return poll(); }
    schedule();
  }
  function schedule() {
    clearTimeout(timer);
    if (!token) return;
    const fast = call && call.state !== 'active';
    timer = setTimeout(poll, fast ? 1000 : document.hidden ? 20000 : 3000);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { unread = 0; document.title = TITLE; poll(); }
  });

  async function loadOlder(btn) {
    if (!msgs.length) return;
    btn.disabled = true;
    btn.textContent = '불러오는 중…';

      const d = await api('/api/messages?before=' + msgs[0].id);
      const h0 = list.scrollHeight, t0 = list.scrollTop;
      hasMore = d.hasMore;
      for (const m of d.messages) if (!ids.has(m.id)) { ids.add(m.id); msgs.push(m); }
      msgs.sort((a, b) => a.id - b.id);
      renderAll();
      list.scrollTop = list.scrollHeight - h0 + t0;

      btn.textContent = '이전 대화 더 보기';
    }
  }

    if (!confirm('이 메시지를 지울까요?\n가족 모두의 화면에서 사라져요.')) return;
    try {
      await api('/api/messages?id=' + m.id, { method: 'DELETE' });

  }

  function keyBytes(b64) {

  async function subscribePush() {

    if (!sub) sub = await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(publicKey) });
    store.set('fc_vapid', publicKey);
    await api('/api/push', { method: 'POST', body: JSON.stringify({ subscription: sub.toJSON() }) });

      await api('/api/push', { method: 'POST', body: JSON.stringify({ action: 'unsubscribe', endpoint: sub.endpoint }) }).catch(() => {});

    if (pushOn) {
      const choice = prompt('알림이 켜져 있어요.\n1 = 시험 알림 받아 보기\n2 = 이 기기에서 알림 끄기\n번호를 적어 주세요', '1');
      if (choice === '1') { sendTestPush(); return; }
      if (choice !== '2') return;
      store.set('fc_push_off', '1');
      await unsubscribePush(true);
      updateBell();
      toast('알림을 껐어요');
      return;
    }
    if (IN_APP) return browserAdvice(true);
    if (!PUSH_OK) {
      if (IS_IOS && !STANDALONE) return showHelp('아이패드·아이폰에서 알림 받기', IOS_HELP);
      return showHelp('이 브라우저는 알림을 못 받아요',
        '<p class="note">크롬, 삼성 인터넷, 사파리(홈 화면에 추가) 최신 버전에서 알림을 받을 수 있어요.</p>');
    }
    if (Notification.permission === 'denied') return showHelp('알림이 막혀 있어요', DENIED_HELP);
    // 아이패드는 버튼을 누른 바로 그 순간에 허락을 물어야 해서 다른 일보다 먼저 한다
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      if (perm === 'denied') showHelp('알림이 막혀 있어요', DENIED_HELP);
      else toast('알림이 허용되지 않았어요');
      return;
    }
    bell.disabled = true;
    try {
      if (!swReg) swReg = await navigator.serviceWorker.ready;
      await subscribePush();
      store.del('fc_push_off');
      toast('알림을 켰어요! 🔔');
      sendTestPush();
    } catch (e) {
      toast('알림 켜기에 실패했어요. 잠시 후 다시 해 주세요');
    } finally {
      bell.disabled = false;
      updateBell();
    }
  };

  // ---------- 소리 (벨소리·띵) ----------
  let actx = null, toneTimer = null;
  let sleepTimer = null;
  function audioCtx() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume().catch(() => {});
    } catch {}
    restAudioSoon();
    return actx;
  }
  // 소리를 다 내면 잠깐 뒤 스피커를 놓아준다 (계속 쥐고 있으면 '재생 중'으로 보임)
  function restAudioSoon() {
    clearTimeout(sleepTimer);
    sleepTimer = setTimeout(() => {
      if (actx && !toneTimer && actx.state === 'running') actx.suspend().catch(() => {});
    }, 4000);
  }
  // 브라우저는 화면을 한 번 만진 뒤에야 소리를 낼 수 있게 해 준다 (첫 터치 때 한 번 준비)
  document.addEventListener('pointerdown', () => { if (!actx) audioCtx(); }, { capture: true });

  function beep(freqs, dur, vol, delay = 0) {
    const a = audioCtx();
    if (!a) return;
    const t = a.currentTime + delay;
    const g = a.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.setValueAtTime(vol, t + dur - 0.06);
    g.gain.linearRampToValueAtTime(0, t + dur);
    g.connect(a.destination);
    for (const f of freqs) {
      const o = a.createOscillator();
      o.type = 'sine';
      o.frequency.value = f;
      o.connect(g);
      o.start(t);
      o.stop(t + dur);
    }
  }
  function chime() {
    beep([1046.5], 0.18, 0.2);
    beep([1568], 0.35, 0.2, 0.16);
    if (navigator.vibrate) navigator.vibrate([200, 80, 200]);
  }
  function startTone(kind) {
    stopTone();
    const play = kind === 'ring'
      ? () => { beep([880, 1320], 0.4, 0.2); beep([880, 1320], 0.4, 0.2, 0.55); if (navigator.vibrate) navigator.vibrate([600, 300, 600]); }
      : () => beep([440, 480], 1.2, 0.16);   // 거는 쪽: "뚜르르~" 신호음
    play();
    toneTimer = setInterval(play, kind === 'ring' ? 2200 : 3200);
  }
  function stopTone() {
    clearInterval(toneTimer);
    toneTimer = null;
    if (navigator.vibrate) navigator.vibrate(0);
    restAudioSoon();
  }

  // ---------- 통화 (영상·음성) ----------
  let iceServers = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }];
  let call = null;          // 지금 하고 있는 통화
  let sigCursor = 0;        // 이 번호 이후의 통화 신호를 받는다
  const endedCalls = new Set();
  const RING_MS = 45000;
  const cv = $('#callView');

  const kindName = (c) => (c.video ? '영상통화' : '음성통화');
  const fmtDur = (ms) => {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}분 ${String(s % 60).padStart(2, '0')}초`;
  };
  const newId = () => (crypto.randomUUID ? crypto.randomUUID()
    : '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, (c) => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));

  function signal(to, kind, callId, data) {
    return api('/api/call', { method: 'POST', body: JSON.stringify({ to, kind, call_id: callId, data }) });
  }

  function mediaError(e) {
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) return '카메라·마이크 사용을 허용해 주세요';
    if (e && e.name === 'NotFoundError') return '카메라나 마이크를 찾지 못했어요';
    if (e && e.name === 'NotReadableError') return '다른 앱이 카메라·마이크를 쓰고 있어요';
    return (e && e.message) || '통화를 시작하지 못했어요';
  }

  async function getMedia(video) {
    if (!navigator.mediaDevices?.getUserMedia || !window.RTCPeerConnection) {
      throw new Error('이 브라우저에서는 통화를 할 수 없어요');
    }
    return navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: video ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false,
    });
  }

  // 연결 주소를 다 모을 때까지 잠깐 기다렸다가 한 번에 보낸다
  function waitIce(pc, ms = 3500) {
    return new Promise((resolve) => {
      if (pc.iceGatheringState === 'complete') return resolve();
      const t = setTimeout(resolve, ms);
      pc.addEventListener('icegatheringstatechange', () => {
        if (pc.iceGatheringState === 'complete') { clearTimeout(t); resolve(); }
      });
    });
  }

  function makePeer(c) {
    const pc = new RTCPeerConnection({ iceServers });
    c.pc = pc;
    pc.ontrack = (e) => {
      const v = $('#remoteVideo');
      const stream = e.streams[0] || new MediaStream([e.track]);
      if (v.srcObject !== stream) v.srcObject = stream;
      v.play().catch(() => {});
    };
    pc.onconnectionstatechange = () => {
      if (call !== c) return;
      const st = pc.connectionState;
      if (st === 'connected') {
        clearTimeout(c.dropTimer);
        if (!c.startedAt) {
          c.startedAt = Date.now();
          c.state = 'active';
          clearTimeout(c.timeout);
          clearTimeout(c.connTimer);
          stopTone();
          c.tick = setInterval(() => { if (call === c) $('#callStatus').textContent = fmtDur(Date.now() - c.startedAt); }, 1000);
          renderCall();
          schedule();
        }
      } else if (st === 'failed') {
        endCall('연결이 끊겼어요');
      } else if (st === 'disconnected') {
        clearTimeout(c.dropTimer);
        c.dropTimer = setTimeout(() => { if (call === c && pc.connectionState !== 'connected') endCall('연결이 끊겼어요'); }, 8000);
      }
    };
    return pc;
  }

  function wireChannel(c, ch) {
    c.channel = ch;
    ch.onmessage = (e) => { if (e.data === 'bye' && call === c) endCall('통화가 끝났어요'); };
  }

  function connectTimeout(c) {
    c.connTimer = setTimeout(() => {
      if (call === c && !c.startedAt) {
        signal(c.peer, 'hangup', c.id).catch(() => {});
        endCall('연결하지 못했어요. 와이파이나 데이터를 확인해 주세요');
      }
    }, 25000);
  }

  // 전화 걸기
  async function startCall(peer, video) {
    if (call) return;
    $('#pick').classList.add('hidden');
    const c = { id: newId(), peer, video, role: 'caller', state: 'calling' };
    call = c;
    renderCall();
    startTone('ringback'); // 버튼을 누르자마자 신호음이 들리게
    try {
      c.local = await getMedia(video);
      if (call !== c) { c.local.getTracks().forEach((t) => t.stop()); return; }
      renderCall();
      const pc = makePeer(c);
      wireChannel(c, pc.createDataChannel('ctl'));
      c.local.getTracks().forEach((t) => pc.addTrack(t, c.local));
      await pc.setLocalDescription(await pc.createOffer());
      await waitIce(pc);
      if (call !== c) return;
      await signal(peer, 'offer', c.id, { sdp: pc.localDescription.sdp, video });
      if (call !== c) { signal(peer, 'hangup', c.id).catch(() => {}); return; }
      c.timeout = setTimeout(() => {
        if (call === c && c.state === 'calling') {
          signal(peer, 'hangup', c.id).catch(() => {});
          endCall(`${peer}님이 받지 않아요`, { missed: true });
        }
      }, RING_MS);
      schedule();
    } catch (e) {
      endCall(mediaError(e));
    }
  }

  // 전화 받기 화면 띄우기
  function incoming(s, age) {
    const c = { id: s.call_id, peer: s.from_name, video: !!(s.data && s.data.video), role: 'callee', state: 'ringing', offer: s.data && s.data.sdp };
    call = c;
    renderCall();
    startTone('ring');
    c.timeout = setTimeout(() => { if (call === c && c.state === 'ringing') endCall('부재중 전화가 있었어요'); }, Math.max(5000, RING_MS - age));
    schedule();
  }

  async function answerCall() {
    const c = call;
    if (!c || c.state !== 'ringing') return;
    c.state = 'connecting';
    stopTone();
    clearTimeout(c.timeout);
    renderCall();
    try {
      c.local = await getMedia(c.video);
      if (call !== c) { c.local.getTracks().forEach((t) => t.stop()); return; }
      renderCall();
      const pc = makePeer(c);
      pc.ondatachannel = (e) => wireChannel(c, e.channel);
      c.local.getTracks().forEach((t) => pc.addTrack(t, c.local));
      await pc.setRemoteDescription({ type: 'offer', sdp: c.offer });
      await pc.setLocalDescription(await pc.createAnswer());
      await waitIce(pc);
      if (call !== c) return;
      await signal(c.peer, 'answer', c.id, { sdp: pc.localDescription.sdp });
      connectTimeout(c);
    } catch (e) {
      signal(c.peer, 'hangup', c.id).catch(() => {});
      endCall(mediaError(e));
    }
  }

  async function gotAnswer(c, s) {
    c.state = 'connecting';
    stopTone();
    clearTimeout(c.timeout);
    renderCall();
    signal(c.peer, 'taken', c.id).catch(() => {}); // 같은 이름의 다른 기기들은 벨을 멈추게
    try {
      await c.pc.setRemoteDescription({ type: 'answer', sdp: s.data.sdp });
      connectTimeout(c);
    } catch {
      signal(c.peer, 'hangup', c.id).catch(() => {});
      endCall('연결하지 못했어요');
    }
  }

  function declineCall() {
    const c = call;
    if (!c) return;
    signal(c.peer, 'decline', c.id).catch(() => {});
    endCall();
  }

  function hangUp() {
    const c = call;
    if (!c) return;
    try { c.channel && c.channel.readyState === 'open' && c.channel.send('bye'); } catch {}
    signal(c.peer, 'hangup', c.id).catch(() => {});
    endCall();
  }

  function endCall(msg, opts = {}) {
    const c = call;
    if (!c) return;
    call = null;
    endedCalls.add(c.id);
    [c.timeout, c.dropTimer, c.connTimer].forEach(clearTimeout);
    clearInterval(c.tick);
    stopTone();
    try { c.pc && c.pc.close(); } catch {}
    if (c.local) c.local.getTracks().forEach((t) => t.stop());
    $('#remoteVideo').srcObject = null;
    $('#localVideo').srcObject = null;
    cv.className = 'hidden';
    if (msg) toast(msg);
    // 통화 기록은 건 사람 쪽에서만 채팅방에 남긴다
    if (c.role === 'caller') {
      if (c.startedAt) postCallLog(`📞 ${c.peer}님과 ${kindName(c)} ${fmtDur(Date.now() - c.startedAt)}`, true);
      else if (opts.missed) postCallLog(`📞 ${c.peer}님, 부재중 ${kindName(c)}가 있어요`, false);
    }
    schedule();
  }

  function postCallLog(text, quiet) {
    api('/api/messages', { method: 'POST', body: JSON.stringify({ kind: 'text', body: text, quiet }) })
      .then((d) => addMessages([d.message])).catch(() => {});
  }

  function callButton(label, icon, cls, onClick) {
    const b = el('button', 'c-btn ' + (cls || ''));
    b.type = 'button';
    b.append(el('span', null, icon), document.createTextNode(label));
    b.onclick = onClick;
    return b;
  }

  function renderCall() {
    const c = call;
    if (!c) return;
    const videoLive = c.video && c.state === 'active';
    cv.className = [videoLive ? 'with-video' : '', c.video && c.local ? 'show-local' : '', c.state === 'ringing' ? 'ringing' : ''].join(' ');
    paintAvatar($('#callAvatar'), c.peer);
    $('#callName').textContent = c.peer;
    $('#callStatus').textContent = {
      calling: `${kindName(c)} 거는 중…`,
      ringing: `${kindName(c)}가 왔어요`,
      connecting: '연결하는 중…',
      active: c.startedAt ? fmtDur(Date.now() - c.startedAt) : '',
    }[c.state];
    if (c.local && c.video) {
      const lv = $('#localVideo');
      if (lv.srcObject !== c.local) lv.srcObject = c.local;
    }

    const acts = $('#callActions');
    acts.replaceChildren();
    if (c.state === 'ringing') {
      acts.append(
        callButton('거절', '✕', 'red', declineCall),
        callButton('받기', c.video ? '🎥' : '📞', 'green', answerCall),
      );
      return;
    }
    if (c.state === 'active' && c.local) {
      const mic = c.local.getAudioTracks()[0];
      const micOff = mic && !mic.enabled;
      acts.append(callButton(micOff ? '마이크 꺼짐' : '마이크', micOff ? '🔇' : '🎤', micOff ? 'off' : '', () => {
        c.local.getAudioTracks().forEach((t) => { t.enabled = !t.enabled; });
        renderCall();
      }));
      if (c.video) {
        const cam = c.local.getVideoTracks()[0];
        const camOff = cam && !cam.enabled;
        acts.append(callButton(camOff ? '카메라 꺼짐' : '카메라', camOff ? '🚫' : '🎥', camOff ? 'off' : '', () => {
          c.local.getVideoTracks().forEach((t) => { t.enabled = !t.enabled; });
          renderCall();
        }));
      }
    }
    acts.append(callButton(c.state === 'calling' ? '취소' : '끊기', '📞', 'red', hangUp));
  }

  // 서버에서 받은 통화 신호 처리
  function handleSignals(list, nowIso) {
    if (!list || !list.length) return;
    const now = nowIso ? Date.parse(nowIso) : Date.now();
    const closed = new Set(list.filter((s) => s.kind !== 'offer' && s.kind !== 'answer').map((s) => s.call_id));
    for (const s of list) {
      sigCursor = Math.max(sigCursor, s.id);
      const mine = call && call.id === s.call_id;
      switch (s.kind) {
        case 'offer': {
          if (endedCalls.has(s.call_id) || closed.has(s.call_id) || mine) break;
          const age = now - Date.parse(s.created_at);
          if (age > RING_MS) break;
          if (call) { signal(s.from_name, 'busy', s.call_id).catch(() => {}); break; }
          incoming(s, age);
          break;
        }
        case 'answer':
          if (mine && call.role === 'caller' && call.state === 'calling') gotAnswer(call, s);
          break;
        case 'decline':
          if (mine && call.role === 'caller') endCall(`${call.peer}님이 지금은 받을 수 없대요`);
          break;
        case 'busy':
          if (mine && call.role === 'caller') endCall(`${call.peer}님이 다른 통화 중이에요`);
          break;
        case 'hangup':
          if (mine) endCall(call.state === 'ringing' ? '부재중 전화가 있었어요' : '통화가 끝났어요');
          else endedCalls.add(s.call_id);
          break;
        case 'taken':
          if (mine && call.role === 'callee' && call.state === 'ringing') endCall('다른 기기에서 전화를 받았어요');
          else if (!mine) endedCalls.add(s.call_id);
          break;
      }
    }
  }

  // 누구에게 걸지 고르기
  async function openPicker() {
    const listBox = $('#pickList');
    listBox.replaceChildren(el('p', 'note', '가족 목록을 불러오는 중…'));
    $('#pick').classList.remove('hidden');
    try {
      const d = await api('/api/call');
      if (d.iceServers?.length) iceServers = d.iceServers;
      listBox.replaceChildren();
      if (!d.members.length) {
        listBox.append(el('p', 'note', '아직 다른 가족이 없어요.\n가족이 채팅방에 들어와 글을 한 번 남기면 여기에 나와요.'));
        return;
      }
      for (const name of d.members) {
        const row = el('div', 'member');
        const av = el('div', 'avatar');
        paintAvatar(av, name);
        const v = el('button', 'mbtn', '🎥 영상');
        v.type = 'button';
        v.onclick = () => startCall(name, true);
        const a = el('button', 'mbtn', '📞 음성');
        a.type = 'button';
        a.onclick = () => startCall(name, false);
        row.append(av, el('div', 'nm', name), v, a);
        listBox.append(row);
      }
    } catch (e) {
      listBox.replaceChildren(el('p', 'note', e.message));
    }
  }
  $('#callBtn').onclick = openPicker;

  // ---------- 앱으로 설치 (안드로이드 크롬·삼성 인터넷) ----------
  // 앱으로 설치하면 알림이 '우리 가족' 앱 이름으로 오고, 소리 설정도 따로 할 수 있다
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    installEvt = e;
    $('#installBtn').classList.remove('hidden');
  });
  window.addEventListener('appinstalled', () => $('#installBtn').classList.add('hidden'));
  $('#installBtn').onclick = async () => {
    if (!installEvt) return;
    installEvt.prompt();
    const r = await installEvt.userChoice.catch(() => ({}));
    installEvt = null;
    $('#installBtn').classList.add('hidden');
    if (r.outcome === 'accepted') toast('홈 화면에 🏠 우리 가족 앱이 생겨요');
  };
  $('#pickClose').onclick = () => $('#pick').classList.add('hidden');

  // 창을 닫으면 상대에게도 통화가 끝났다고 알린다
  window.addEventListener('pagehide', () => {
    if (!call || !token) return;
    try { call.channel && call.channel.readyState === 'open' && call.channel.send('bye'); } catch {}
    fetch('/api/call', {
      method: 'POST', keepalive: true,
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
      body: JSON.stringify({ to: call.peer, kind: call.state === 'ringing' ? 'decline' : 'hangup', call_id: call.id }),
    }).catch(() => {});
  });

  // ---------- 프로필 사진 ----------
  const profiles = new Map(); // 이름 -> { path, url }
  let profileTimer = null;

  function paintAvatar(node, name) {
    node.dataset.av = name;
    const p = profiles.get(name);
    if (p && p.url) {
      node.textContent = '';
      node.style.background = `#ddd center / cover no-repeat url("${p.url}")`;
    } else {
      node.textContent = [...name][0] || '?';
      node.style.background = colorOf(name);
    }
  }
  function repaintAvatars() {
    document.querySelectorAll('[data-av]').forEach((n) => paintAvatar(n, n.dataset.av));
  }

  async function loadProfiles() {
    try {
      const d = await api('/api/profile');
      let changed = false;
      const seen = new Set();
      for (const p of d.profiles) {
        seen.add(p.name);
        const cur = profiles.get(p.name);
        // 같은 사진이면 주소를 그대로 둬서 다시 내려받지 않게 한다
        if (!cur || cur.path !== p.path) { profiles.set(p.name, { path: p.path, url: p.url }); changed = true; }
      }
      for (const n of [...profiles.keys()]) if (!seen.has(n)) { profiles.delete(n); changed = true; }
      if (changed) repaintAvatars();
    } catch {}
  }

  // 가운데를 정사각형으로 잘라 작게 만든다
  async function squareImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const c = document.createElement('canvas');
      c.width = c.height = 320;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, 320, 320);
      ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, 320, 320);
      const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.88));
      if (!blob) throw new Error('사진을 읽지 못했어요');
      return blob;
    } catch {
      throw new Error('이 사진은 쓸 수 없어요. 다른 사진을 골라 주세요');
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function openProfile() {
    paintAvatar($('#pfAvatar'), myName);
    $('#pfName').value = myName;
    $('#pfErr').textContent = '';
    $('#pfRemove').classList.toggle('hidden', !profiles.get(myName));
    $('#profile').classList.remove('hidden');
  }
  $('#meBtn').onclick = openProfile;
  $('#pfClose').onclick = () => $('#profile').classList.add('hidden');
  $('#pfPhoto').onclick = () => $('#pfFile').click();

  $('#pfFile').onchange = async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    $('#pfErr').textContent = '사진 올리는 중…';
    try {
      const blob = await squareImage(f);
      const up = await api('/api/upload', { method: 'POST', body: JSON.stringify({ type: 'image/jpeg', size: blob.size }) });
      await putFile(up.signedUrl, blob, () => {});
      const d = await api('/api/profile', { method: 'POST', body: JSON.stringify({ action: 'avatar', avatar_path: up.path }) });
      profiles.set(myName, { path: d.path, url: d.url });
      repaintAvatars();
      $('#pfRemove').classList.remove('hidden');
      $('#pfErr').textContent = '';
      toast('프로필 사진을 바꿨어요');
    } catch (err) {
      $('#pfErr').textContent = err.message;
    }
  };

  $('#pfRemove').onclick = async () => {
    if (!confirm('프로필 사진을 지울까요?')) return;
    try {
      await api('/api/profile', { method: 'POST', body: JSON.stringify({ action: 'remove_avatar' }) });
      profiles.delete(myName);
      repaintAvatars();
      $('#pfRemove').classList.add('hidden');
    } catch (err) {
      $('#pfErr').textContent = err.message;
    }
  };

  $('#pfSave').onclick = async () => {
    const next = $('#pfName').value.replace(/\s+/g, ' ').trim();
    if (!next || next === myName) return;
    if (!confirm(`이름을 '${next}'(으)로 바꿀까요?\n지금까지 보낸 메시지도 새 이름으로 바뀌어요.`)) return;
    try {
      const d = await api('/api/profile', { method: 'POST', body: JSON.stringify({ action: 'rename', name: next }) });
      const old = myName;
      token = d.token; myName = d.name;
      store.set('fc_token', token); store.set('fc_name', myName);
      for (const m of msgs) if (m.author === old) m.author = myName;
      const p = profiles.get(old);
      if (p) { profiles.delete(old); profiles.set(myName, p); }
      if (reads.has(old)) { reads.set(myName, reads.get(old)); reads.delete(old); }
      rows.clear();
      renderAll();
      $('#meChip').textContent = myName;
      paintAvatar($('#meAvatar'), myName);
      paintAvatar($('#pfAvatar'), myName);
      toast('이름을 바꿨어요');
    } catch (err) {
      $('#pfErr').textContent = err.message;
    }
  };

  // ---------- 읽음 표시 ----------
  let reads = new Map();   // 이름 -> 마지막으로 본 메시지 번호
  let sentRead = 0;

  function handleReads(list) {
    if (!Array.isArray(list)) return;
    const next = new Map(list.map((r) => [r.name, Number(r.last_read_id)]));
    let same = next.size === reads.size;
    if (same) for (const [k, v] of next) if (reads.get(k) !== v) { same = false; break; }
    if (same) return;
    reads = next;
    renderSeen();
  }

  // 각 가족이 마지막으로 본 메시지 아래에 작은 사진과 이름을 단다
  function renderSeen() {
    box.querySelectorAll('.seen').forEach((n) => n.remove());
    if (!msgs.length) return;
    const groups = new Map();
    for (const [name, rid] of reads) {
      if (name === myName) continue;
      let target = null;
      for (let i = msgs.length - 1; i >= 0; i--) if (msgs[i].id <= rid) { target = msgs[i]; break; }
      if (!target || target.author === name) continue; // 자기가 쓴 글 밑에는 안 단다
      if (!groups.has(target.id)) groups.set(target.id, { m: target, names: [] });
      groups.get(target.id).names.push(name);
    }
    for (const { m, names } of groups.values()) {
      const row = rows.get(m.id);
      if (!row || !row.isConnected) continue;
      const s = el('div', 'seen' + (m.author === myName ? ' mine' : ''));
      for (const n of names) {
        const a = el('span', 'avatar xs');
        paintAvatar(a, n);
        s.append(a);
      }
      s.append(el('span', 'seen-text', names.join('·') + ' 봤어요'));
      row.after(s);
    }
  }

  // ---------- 들어가기 / 나가기 ----------
  function showLogin(msg) {
    $('#chat').classList.add('hidden');
    $('#login').classList.remove('hidden');
    $('#loginErr').textContent = msg || '';
    $('#nameInput').value = myName;
  }

  function logout(msg) {
    if (call) hangUp();
    clearTimeout(timer);
    clearInterval(profileTimer);
    reads = new Map();
    sentRead = 0;
    token = null;
    store.del('fc_token');
    msgs = []; ids.clear(); rows.clear();
    box.replaceChildren(); pendingBox.replaceChildren();
    cursor = 0; renderedMax = 0;
    showLogin(msg);
  }

  $('#logoutBtn').onclick = async () => {
    if (!confirm('이 기기에서 나갈까요?\n다시 들어오려면 가족 비밀번호가 필요해요.\n이 기기의 채팅 알림도 꺼져요.')) return;
    await unsubscribePush(true);
    logout();
  };

  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#loginBtn');
    btn.disabled = true;
    $('#loginErr').textContent = '';
    try {
      const d = await api('/api/login', { method: 'POST', body: JSON.stringify({
        name: $('#nameInput').value, password: $('#pwInput').value }) });
      token = d.token; myName = d.name;
      store.set('fc_token', token); store.set('fc_name', myName);
      $('#pwInput').value = '';
      start();
    } catch (err) {
      $('#loginErr').textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });

  async function start() {
    $('#login').classList.add('hidden');
    $('#chat').classList.remove('hidden');
    $('#meChip').textContent = myName;
    paintAvatar($('#meAvatar'), myName);
    loadProfiles();
    clearInterval(profileTimer);
    profileTimer = setInterval(() => { if (token && !document.hidden) loadProfiles(); }, 60000);
    box.replaceChildren(el('div', 'empty', '불러오는 중…'));
    try {
      const d = await api('/api/messages?sig=' + sigCursor);
      hasMore = d.hasMore;
      msgs = []; ids.clear(); rows.clear();
      for (const m of d.messages) { ids.add(m.id); msgs.push(m); }
      cursor = msgs.length ? msgs[msgs.length - 1].id : 0;
      handleReads(d.reads);
      renderAll();
      scrollBottom();
      handleSignals(d.signals, d.now);
    } catch (e) {
      if (!token) return;
      box.replaceChildren(el('div', 'empty', e.message));
    }
    schedule();
    if (token) {
      initPush();
      api('/api/call').then((d) => { if (d.iceServers?.length) iceServers = d.iceServers; }).catch(() => {});
    }
  }

  if (token) start(); else showLogin();
})();
</script>
</body>
</html>
